<!doctype html>
<!-- AI-assisted design sample by Codex. Static concept, no backend. -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾光小铺 商品展示样稿</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf8f2;color:#2c4337;font-family:"Microsoft YaHei",sans-serif}button{font:inherit;color:inherit;cursor:pointer}header,main,footer{max-width:1180px;margin:auto;padding:28px 36px}header{display:flex;justify-content:space-between;border-bottom:1px solid #dcdccf;align-items:center}.brand{font-size:25px;letter-spacing:3px}.brand small{display:block;font:10px sans-serif;letter-spacing:2px;margin-top:6px}.badge{font-size:12px;color:#898776}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:60px;padding:28px 0 40px;align-items:end}.kicker{font-size:11px;letter-spacing:3px;color:#968267}h1{font-family:serif;font-size:clamp(35px,5vw,60px);font-weight:500;line-height:1.25;margin:18px 0}.hero p{font-size:14px;color:#7d8073;line-height:1.9}.aside{border-left:2px solid #b58561;padding-left:24px;margin-bottom:15px}.aside strong{font-weight:500}.heading{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ddddd0;padding:15px 0}h2{font-size:19px;font-weight:500}.filters{display:flex;gap:6px}.filters button{border:0;border-radius:22px;padding:8px 16px;background:transparent;font-size:12px}.filters button[aria-pressed=true]{background:#2c5240;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.pic{display:block;border:0;padding:0;width:100%;overflow:hidden;border-radius:4px}.pic img{display:block;width:100%;transition:transform .25s}.pic:hover img{transform:scale(1.035)}article small{display:block;font-size:10px;color:#8f8e7c;letter-spacing:1px;margin:19px 0 12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}h3{font-size:16px;font-weight:500;margin:0}.row span{font:16px Georgia,serif}.detail{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid #d9dacb;padding:17px 0;background:none;font-size:12px;color:#77816e}.note{font-size:12px;line-height:1.9;color:#818271;background:#efeee4;padding:18px 22px;margin:40px 0 0}footer{font-size:11px;color:#93917f;padding-top:5px}dialog{background:#faf8f2;color:#2c4337;border:1px solid #ddd;border-radius:8px;padding:24px;width:90%;max-width:440px}dialog img{width:100%}dialog p{font-size:14px;line-height:1.9}dialog button{border:0;background:#2c5240;color:white;padding:10px 24px}dialog::backdrop{background:#152a2290}button:focus-visible{outline:3px solid #bd8058;outline-offset:4px}[hidden]{display:none!important}@media(max-width:700px){header,main,footer{padding:22px}.badge{max-width:100px;line-height:1.8}.hero{grid-template-columns:1fr;gap:12px}.grid{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column;padding-bottom:22px}.pic img{max-height:360px;object-fit:contain}}
</style></head><body><header><div class="brand">拾光小铺<small>EVERYDAY FINDS</small></div><div class="badge">校园生活选物 · 设计方向样稿</div></header><main><section class="hero"><div><span class="kicker">A LITTLE JOY, EVERY DAY</span><h1>把日常，<br>过成喜欢的样子。</h1><p>一页笔记，一只布袋，一枚书签。<br>从校园里的小物开始，收集平凡日子的灵感。</p></div><div class="aside"><strong>素材从这里开始</strong><p>原创商品插画，搭配自编演示资料。<br>图片随项目保存，打开页面即可展示；<br>后续可替换为你拍摄的实物照片。</p></div></section><section><div class="heading"><h2>日常选物 / 03</h2><div class="filters" aria-label="商品分类"></div></div><div class="grid"></div></section><p class="note">本页用于讨论素材和页面风格。商品为虚构演示商品，图片是原创插画，价格为样例数据。可切换分类或点击商品查看说明；注册、购物车、支付及后台将在正式项目中逐步实现。</p></main><footer>拾光小铺 / 素材方向提案 / 店名与主题可调整</footer><dialog id="dialog"><img id="di" alt=""><h2 id="dt"></h2><p id="dd"></p><button onclick="document.getElementById('dialog').close()">关闭</button></dialog><script>
const products=[{id:'notebook',name:'山野随行笔记本',category:'纸品',price:'28.00'},{id:'bag',name:'慢午后帆布袋',category:'随行',price:'39.00'},{id:'bookmark',name:'拾叶金秋书签',category:'小物',price:'12.00'}];
const imageFor=p=>'assets/'+p.id+'.svg';
document.querySelector('.grid').innerHTML=products.map((p,i)=>`<article data-category="${p.category}"><button class="pic" onclick="show(${i})" aria-label="查看${p.name}"><img src="${imageFor(p)}" alt="${p.name}原创插画"></button><small>${p.category} / EVERYDAY COLLECTION</small><div class="row"><h3>${p.name}</h3><span>¥${p.price}</span></div><button class="detail" onclick="show(${i})">查看设计 <span>↗</span></button></article>`).join('');
document.querySelector('.filters').innerHTML=['全部','纸品','随行','小物'].map((cat,i)=>`<button aria-pressed="${i===0}" onclick="filter('${cat}',this)">${cat}</button>`).join('');
function filter(cat,btn){document.querySelectorAll('article').forEach(x=>x.hidden=cat!=='全部'&&x.dataset.category!==cat);document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',String(x===btn)))}
function show(i){const p=products[i];document.getElementById('di').src=imageFor(p);document.getElementById('di').alt=p.name+'原创插画';document.getElementById('dt').textContent=p.name;document.getElementById('dd').textContent='原创商品示意图，非实物照片。商品及价格均为课程演示数据；正式开发后可在后台维护图片、名称、价格和库存。';document.getElementById('dialog').showModal()}
</script></body></html>
